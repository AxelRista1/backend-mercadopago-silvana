<!DOCTYPE html>
<html>
<head>
  <title>Pago exitoso</title>
</head>

<style>

/* ===== fondo ===== */
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg,#eef7ee,#f4f4f4);
}

/* ===== tarjeta principal ===== */
.success-container{
  background:white;
  padding:50px;
  border-radius:14px;
  box-shadow:0 15px 40px rgba(0,0,0,0.12);
  text-align:center;
  max-width:500px;
}

/* ===== icono ===== */
.success-icon{
  font-size:60px;
  color:#2e7d32;
  margin-bottom:10px;
}

/* ===== titulo ===== */
.success-title{
  font-size:28px;
  margin-bottom:10px;
}

/* ===== texto ===== */
.success-text{
  color:#555;
  margin-bottom:30px;
  line-height:1.6;
}

/* ===== botón descarga ===== */
.download-button{
  display:inline-block;
  background:#2e7d32;
  color:white;
  padding:15px 30px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  margin-right:10px;
  transition:0.25s;
}

.download-button:hover{
  background:#1b5e20;
}

/* ===== botón volver ===== */
.back-button{
  display:inline-block;
  padding:15px 30px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  background:#eeeeee;
  color:#333;
}

.back-button:hover{
  background:#dddddd;
}

</style>

</head>

<body>

<div class="success-container">

<div class="success-icon">✅</div>

<h1 class="success-title">Pago aprobado</h1>

<p class="success-text">
Gracias por tu compra.<br><br>

Tu pago fue procesado correctamente y ya podés descargar el material del curso.
Te recomendamos guardar el archivo en tu computadora para acceder a él cuando quieras.
</p>

<a id="descarga" class="download-button" style="display:none;">
  Descargar tu curso
</a>

<a href="index.html" class="back-button">
Volver al sitio
</a>

</div>


  <script>
const params = new URLSearchParams(window.location.search);
const paymentId = params.get("payment_id");

const archivos = {
  feng: "pdf/curso-feng.pdf",
  mate: "pdf/Curso-Yerva-Mate.zip",
  jardines: "pdf/Book-Jardín-Zen.pdf"
};

async function verificarPago() {

  const res = await fetch(
    `https://backend-mercadopago-silvana.onrender.com/verificar-pago/${paymentId}`
  );

  const data = await res.json();

  if (data.aprobado) {

    const curso = data.curso;
    const link = archivos[curso];

    const boton = document.getElementById("descarga");

    boton.href = link;
    boton.style.display = "inline-block";

  } else {
    alert("El pago no está aprobado aún");
  }
}

verificarPago();
</script>
  
</body>
</html>
